[tool.poetry]
name = "chat-service"
version = "0.1.0"
description = "Chat service for real-time messaging"
authors = ["subhamsahu <sam766626@gmail.com>"]
readme = "README.md"
package-mode = false 

[tool.poetry.dependencies]
python = "^3.13"
fastapi = {extras = ["standard"], version = "^0.116.1"}
itsdangerous = "^2.2.0"
pydantic-settings = "^2.10.1"
python-dotenv = "^1.1.1"
aio-pika = "^9.5.5"
server-shared = {path = "../server-shared"}
elasticsearch = "^8.10.1"
beanie = "^2.0.0"
motor = "^3.7.1"
redis = "^6.4.0"
python-socketio = "^5.11.0"

[tool.poetry.group.dev.dependencies]
typer = "^0.16.0"
pyfiglet = "^1.0.3"
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"