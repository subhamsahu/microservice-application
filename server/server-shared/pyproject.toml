[tool.poetry]
name = "server-shared"
version = "0.1.0"
description = "Reusable shared server-side utilities including logging, middleware, and cloudinary integration."
authors = ["subhamsahu <sam766626@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
cloudinary = "^1.44.1"
elasticsearch = "^8.10.1"
fastapi = "^0.116.1"
pyjwt = "^2.10.1"
secure = "^1.0.1"
slowapi = "^0.1.9"
sqlmodel = "^0.0.24"
asyncmy = "^0.2.10"
greenlet = "^3.2.3"
passlib = "^1.7.4"
cryptography = "^45.0.5"
aiosqlite = "^0.21.0"
asyncpg = "^0.30.0"
aiohttp = "^3.12.15"


[tool.poetry.group.dev.dependencies]
pyfiglet = "^1.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
